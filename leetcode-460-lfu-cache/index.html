<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LFU Cache · Algorithm Lab</title>
  <link rel="stylesheet" href="/explorer.css">
  <link rel="stylesheet" href="/navigation.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <span class="brand">⇄ <span>LFU CACHE <b>/</b> LAB</span></span>
  <a class="library-link" href="/">← All tasks</a>
  <a href="https://leetcode.com/problems/lfu-cache/">LeetCode #460 ↗</a>
</header>
<main>
  <section class="intro">
    <h1>LFU Cache</h1>
    <p>Evict from the lowest frequency bucket. Within that bucket, evict the least recently used key.</p>
  </section>
  <div class="workspace">
    <div class="left">
      <section class="panel">
        <div class="panel-top"><h2>Frequency buckets</h2><code id="min"></code></div>
        <div class="playback">
          <div class="transport">
            <button id="restart" aria-label="Restart">↺</button>
            <button id="back">← Back</button>
            <button id="play" class="primary">▶ Play</button>
            <button id="step">Step →</button>
          </div>
          <label class="speed">Speed <input id="speed" type="range" min="1" max="20" value="4"><output id="speed-value">4×</output></label>
        </div>
        <div class="status"><span id="status" aria-live="polite"></span><span id="step-count"></span></div>
        <div id="buckets"></div>
      </section>
      <section class="card"><h2>Key dictionary</h2><ul id="nodes"></ul></section>
    </div>
    <aside>
      <section class="card">
        <h2>Operations</h2>
        <label class="setting-line">Example <select id="example"><option value="mixed">Frequency and recency</option><option value="tie">Recency tie</option><option value="update">Update existing key</option><option value="" hidden>Custom</option></select></label>
        <form id="config">
          <label class="setting-line">Capacity <input id="capacity" type="number" min="1" max="8" required value="2"></label>
          <label for="operations">One operation per line</label>
          <textarea id="operations" rows="8" spellcheck="false" aria-describedby="syntax"></textarea>
          <p id="syntax" class="hint"><code>put KEY VALUE</code> or <code>get KEY</code></p>
          <p id="error" role="alert"></p>
          <button>Apply</button>
        </form>
      </section>
      <section class="card">
        <div class="section-heading"><h2>Implementation</h2><span>C#</span></div>
        <label class="hint"><input type="checkbox" id="follow-code" checked> Follow code</label>
        <div id="code" class="code" tabindex="0"></div>
      </section>
    </aside>
  </div>
</main>
<script type="module" src="./main.js"></script>
</body>
</html>
